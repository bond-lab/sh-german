# Source editions on Projekt Gutenberg-DE (https://projekt-gutenberg.org) and
# the canonical story each chapter holds.  Chapter numbers are those of the
# book's reader pages (chapter/N/).  Abbreviations follow Jay Finley Christ
# (1947), lowercased, as in the NTU Multilingual Corpus.
#
# The [corpus] table names the corpus (corpusID prefix in the XML), the
# licence recorded in the XML and the offset added to document numbers.
#
# Editorial text that is not Doyle's (frame narrative added in the Franckh
# reissues, prefaces, publisher's and translator's front matter) is kept
# but marked, so that it is not aligned across languages:
#   front_until: paragraphs before the one starting with this text are
#                front matter
#   front:       number of leading paragraphs that are front matter
#   frame_prefix: text at the start of the first story paragraph that belongs
#                to the frame (split off into its own paragraph)
#   frame_from:  the paragraph starting with this text and all after it are
#                frame narrative or closing matter

